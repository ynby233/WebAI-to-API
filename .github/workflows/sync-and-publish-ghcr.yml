name: Sync Upstream and Publish Docker Image

on:
  workflow_dispatch:
  schedule:
    - cron: "17 20 * * 1"
  push:
    branches: [master]

permissions:
  contents: write
  packages: write

concurrency:
  group: webai-to-api-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync upstream master
        if: github.event_name != 'push'
        run: |
          git remote add upstream https://github.com/Amm1rr/WebAI-to-API.git || true
          git fetch upstream master
          git merge --no-edit upstream/master
          if ! git diff --quiet origin/master..HEAD; then
            git push origin HEAD:master
          fi

      - name: Set image tags
        id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/webai-to-api"
          short_sha="$(git rev-parse --short=12 HEAD)"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "tags=${image}:latest,${image}:sha-${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print image name
        run: echo "Published ${{ steps.meta.outputs.image }}:latest"